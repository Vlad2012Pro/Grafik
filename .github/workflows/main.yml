name: Build Windows exe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build exe
        run: npm run dist

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: grafik-exe
          path: dist/Grafik-RPRail.exe
